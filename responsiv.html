<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Making Webpage Resposive</title>
    <style>
        html{
            font-size: 25px;
        }
        .container{
            font-size: 10px;
            border: 2px solid black;
            width: 100vw;
            height: 100vh;
        }
        h2{
            text-align: center;
        }
        #first1{
            background-color: tomato;
            padding: 3em;
            font-size: 1.5em;
        }
        #first2{
            font-size: 3rem;
            padding: 3rem;
            background-color: aliceblue;

        }
    </style>
</head>
<body>
    <div class="container">
        <div  class="heading" id="first1"><h2>This is the first heading</h2></div>
        <div  class="heading" id="first2"><h2>This is the second heading</h2></div>
        <div  class="heading" id="first3"><h2>This is the third heading</h2></div>
    </div>
    
</html>
