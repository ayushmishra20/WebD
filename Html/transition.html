<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS transitions</title>
  </head>
  <style>
    body {
      background-color: #070707;
    }
    #box {
      width: 200px;
      height: 200px;
      background-color: red;
      align-items: center;
      display: flex;
      justify-content: center;
      border-radius: 25%;
      transition:
        background-color 0.5s ease,
        transform 0.5s ease;
      transition: all 0.5s ease;
      transition-delay: 0.5s;
    }
    #box:hover {
      background-color: blue;
      transform: scale(1.2);
      font-size: 1.5em;
      height: 300px;
      width:350px;
    }
  </style>
  <body>
    <h2>CSS transitions</h2>
    <div class="container">
      <div id="box">this is the box inside container</div>
    </div>
  </body>
</html>
