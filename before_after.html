<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Before After</title>
  </head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bitcount+Single+Ink:wght@100..900&family=Edu+NSW+ACT+Cursive:wght@400..700&family=Protest+Revolution&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      font-family: "Protest Revolution", sans-serif;
    }
    .navbar {
      text-decoration: none;
      display: flex;
      justify-content: center;
      z-index: -1;
    }
    .item {
      text-decoration: none;
    }
    header::before {
      background: url(https://plus.unsplash.com/premium_photo-1673108852141-e8c3c22a4a22?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D)
        no-repeat center center/cover;
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      opacity: 0.9;
    }
    ul {
      display: flex;
      justify-content: center;
    }
    input {
      padding: 5px;
      border-radius: 50px;
      border: none;
    }
    li {
      list-style: none;
      margin: 0 20px;
      font-size: 20px;
      display: flex;
    }
    section {
      margin: 20px;
      padding: 20px;
      text-align: center;
    }
  </style>
  <body>
    <header>
      <nav class="navbar">
        <ul>
          <li class="item">Home</li>
          <li class="item">About</li>
          <li class="item">Contact</li>
          <input type="search" placeholder="Search..." />
        </ul>
      </nav>
      <section>
        <h1>Welcome To The Food Zone</h1>
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing e sunt repellat
          corporis reiciendis recusandae adipisci tenetur, accusantium sit,
          maxime expedita dolorem ad impedit maiores unde obcaecati aspernatur
          hic!
        </p>
      </section>
    </header>
  </body>
</html>
