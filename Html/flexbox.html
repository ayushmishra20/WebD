<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .container{
            width: 100%;
            display: flex;
            height: 250px;
            border: 2px solid black;
            border-radius: 10px;
            padding: 10px;
            margin: 5px;
            flex-wrap: wrap;
            /* flex-wrap: wrap-reverse; */
            /* flex-direction: row-reverse; */
            /* flex-direction: column; */
            /* justify-content: space-around; */
            /* justify-content: space-evenly; */
            /* justify-content: center; */
            /* align-items: center;
            align-items: flex-start;
            align-items: flex-end; */
        }
        .item{
            background-color: tomato;
            padding: 5px;
            margin: 5px;
            display: flex;
            border: 2px solid darkred;
            border-radius: 5px;
            width: 200px;
            height: 200px;
        }
        #item1{
            flex-grow: 2;
            order: 2;
        }
        #item2{
            order: 3;
            flex-grow: 3;
            flex: 2 1 200px;
            flex-shrink: 1;
            flex-basis: 200px;
            align-items: flex-end;
            align-items: flex-start;
        }


    </style>
</head>
<body>
    <h2><i>Flexbox Example</i></h2>
    <div class="container">
    <div class="item" id="item1">flexbox1</div>
    <div class="item" id="item2">flexbox2</div>
    <div class="item" id="item3">flexbox3</div>
    <div class="item" id="item4">flexbox4</div>
    <div class="item" id="item5">flexbox5</div>
    <div class="item" id="item6">flexbox6</div>

    </div>
</body>
</html>
