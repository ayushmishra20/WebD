<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Two</title>
</head>

<body style="background-color: #414141; color: aliceblue;">
    <h1>Event Two</h1>
    <p>Click the button to see an event in action.</p>
    <button id="myButton">Stop!!</button>
</body>
<script>
    let sayHello = function(){
        console.log("Hello");
    }
    let changeMessage = function(){
        document.querySelector('h1').innerHtml = "Dont click button";
    }
    const changeMe = setTimeout(changeMessage, 3000);

    document.querySelector("#myButton").addEventListener("click", function(e){
        clearTimeout(changeMe);
        console.log("You clicked the button");
    });
</script>
</html>
