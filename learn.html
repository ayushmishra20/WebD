<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of Styling</title>

    <!-- external styling -->
     
    <link rel="stylesheet" href="learn.css">
</head>
<!-- internal styling -->
 <style>
    p{
        background-color: aquamarine;
        color: blue;
    }
 </style>


<body>
    <!-- inline styling -->
    <p style="background-color: aquamarine;
    color: blue;">Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolores dicta vero saepe voluptates, explicabo quo culpa error harumcorrupti nostrum!</p>
    
</body>
</html>
