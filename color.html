<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hight, border, width</title>
    <style>
        body{
            background-color: #414141;
            color: white;
        }
        #heading{
            background-color: aquamarine;
            height: 100px;
             width: 200px;
             border: 2px solid black;
             border-radius: 10px;
        }
        .new{
            background-color: aquamarine;
            height: 50px;
            width: 400px;
            border: 2px solid black;
            border-radius: 10px;
        
        }
        #new{
            border-image: url(https://www.istockphoto.com/photos/photo-image-art);
            height: auto;
            width: 400px;
            border-radius: 7px;
            background-color: aliceblue;
            color: black;
            background-repeat: no-repeat;
            background-position: center;
        }
    </style>

</head>
<body>
    <h3 id="heading">
        Heading
    </h3>
    <p class="new">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Repellendus, voluptatem.</p>

    <h4>Heading for images</h4>
    <p id="new">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Fugiat nostrum cupiditate cum optio voluptatibus veritatis dolorem deleniti voluptate mollitia necessitatibus.</p>
</body>
</html>
