<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>visibility & z-index </title>
    <style>
        .box{
            position: relative;
            top: 5px;
            border: 1px dotted black;
            width: 200px;
            height: 150px;
        }
        #box1{
            position: relative;
            top: 5px;
            background-color: red;
            z-index: -100;
            /* visibility: hidden; */
            /* display: none; */
        }
        #box2{
            position: relative;
            top: 5px ;
            background-color: green;
            z-index: 2;
        }
        #box3{
            position: relative;
            top: 10px;
            background-color: blue;
            z-index: -1;

        }
        #box4{
            position: relative;
            top: 10px;
            background-color: yellow;
            z-index: -10;
        }

    </style>
</head>
<body>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
</body>
</html>
