<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <style>
        body{
            background-color: #414141;
            color: wheat;
        }
    </style>
</head>
<body>
    <h2>Forms In HTML</h2>
    <form action="url" method="get">
        <label for="fname">First Name:</label><br>
        <input type="text" placeholder="First Name" id
        ="fname" name="fname"><br>
        <label for="lname">Last Name:</label><br>
        <input type="text" placeholder="Last Name" id="lname" name="lname"><br>
        <button type="submit" style="background-color: wheat; color: #414141;">Submit</button>
    </form>

</body>
</html>
