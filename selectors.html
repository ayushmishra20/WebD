<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <style>
        /* element selector */
        p {
            color: blue;
        }
        /* class selector */
        .highlight {
            background-color: yellow;
        }
        /* id selector */
        #main {
            font-weight: bold;
        }
        /* group selector */
        h1, h2, h3 {
            color: green;
        }
    </style>
</head>
<body>
    <h1>Selectors in CSS</h1>
    <p>This is a paragraph with an element selector.</p>
    <p class="highlight">This paragraph has a class selector.</p>
    <p id="main">This paragraph has an id selector.</p>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    
</body>
</html>
